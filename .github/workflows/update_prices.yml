name: Daily Pop Mart Price Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional API dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate clean market data
        env:
          SOLDCOMPS_API_KEY: ${{ secrets.SOLDCOMPS_API_KEY }}
          SOLDCOMPS_ENDPOINT: ${{ vars.SOLDCOMPS_ENDPOINT }}
          LIVE_DATA_REQUIRED: "true"
          ALLOW_DEMO_DATA: "false"
        run: python scripts/fetch_and_clean.py

      - name: Commit updated data
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add public/data/*.json
          git diff --cached --quiet || git commit -m "chore: update poptracker market data"
          git push
